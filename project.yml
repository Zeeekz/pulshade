# The iPhone app. Generate the Xcode project with: xcodegen generate
# (The Mac app builds with Swift Package Manager: ./scripts/build-app.sh)
name: Pulshade
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
# The signing team lives in ios/Local.xcconfig (not in git): DEVELOPMENT_TEAM = <your team id>
configFiles:
  Debug: ios/Local.xcconfig
  Release: ios/Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Crash messages and debug info carry source paths; these keep the home folder's name out of the app.
    OTHER_SWIFT_FLAGS: "$(inherited) -enable-upcoming-feature ConciseMagicFile -file-prefix-map $(SRCROOT)=."
targets:
  PulshadeiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/Pulshade
      - path: Sources/PulshadeShared
      - path: ios/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
    dependencies:
      # Tor (Arti). Build it first with ./scripts/build-tor.sh.
      - framework: tor/build/PulshadeTor.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: libresolv.tbd
    # Push: Xcode swaps "development" for "production" when it signs a build for TestFlight or the App Store.
    entitlements:
      path: ios/Pulshade.entitlements
      properties:
        aps-environment: development
    info:
      path: ios/Info.plist
      properties:
        CFBundleDisplayName: PULSHADE
        PulshadeRelay: $(PULSHADE_RELAY)
        PulshadeRelayDirect: $(PULSHADE_RELAY_DIRECT)
        PulshadeRelayPin: $(PULSHADE_RELAY_PIN)
        PulshadeAdminKey: $(PULSHADE_ADMIN_KEY)
        PulshadePetKey: $(PULSHADE_PET_KEY)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHumanReadableCopyright: Built by Zeekz
        # Pulshade has its own end-to-end encryption (Double Ratchet, X25519, ML-KEM-768) built on standard algorithms.
        # App Store Connect's export compliance questions (2026-11-04: not distributed in France) said no documents are
        # needed, so this is false and each upload isn't asked again. Revisit if the app is ever released in France.
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Scan codes to link your devices, add friends and verify them, and take photos for chats and photos and videos for stories. Frames are never saved.
        CFBundleURLTypes:
          - CFBundleURLName: app.pulshade.link
            CFBundleURLSchemes: [pulshade]
        NSPhotoLibraryAddUsageDescription: Save pictures from your chats to Photos. Pulshade only adds to your library and never reads it.
        NSMicrophoneUsageDescription: Record voice notes, videos and make calls. Audio is encrypted before it leaves your phone.
        # fetch: iOS wakes the app now and then to check for announcements (AnnouncementWatch).
        UIBackgroundModes: [audio, fetch, voip, remote-notification]
        BGTaskSchedulerPermittedIdentifiers: [app.pulshade.ios.announcements, app.pulshade.ios.upload]
        NSFaceIDUsageDescription: Unlock PULSHADE with Face ID.
        NSLocalNetworkUsageDescription: Reach a PULSHADE relay running on your own network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # An onion relay can use plain http: Tor already encrypts it end to end.
          NSExceptionDomains:
            onion:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pulshade.ios
        PRODUCT_NAME: Pulshade
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: NO
        # Tor is built for Apple silicon simulators only.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        # Set when building, e.g. PULSHADE_RELAY=http://192.168.1.20:7878, to point the phone at your Mac's relay.
        PULSHADE_RELAY: ""
        # The Pulshade Admin app's public key (relay/admin-key.pub): collectibles and the reports mailbox count only if
        # it signed them.
        PULSHADE_ADMIN_KEY: ""
        # The relay's pet-signing public key (relay/pet-key.pub), for hatched and gifted collectibles.
        PULSHADE_PET_KEY: ""
